name: Release

# Tag-driven release. Git tag is the source of truth.
#
# Developer:
#   1. Set package.json "version" to X.Y.Z and merge to main
#   2. git tag vX.Y.Z && git push origin vX.Y.Z
#
# Auth note:
#   softwareifyCZ org disables write permissions for GITHUB_TOKEN
#   ("Write permissions for workflows are disabled by the organization").
#   Publishing therefore uses repository secret NPM_PUBLISH_TOKEN
#   (classic PAT with write:packages + repo, or fine-grained equivalent).
#   Prefer enabling org workflow write later, then switch back to GITHUB_TOKEN.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require NPM_PUBLISH_TOKEN
        env:
          NPM_PUBLISH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
        run: |
          if [ -z "$NPM_PUBLISH_TOKEN" ]; then
            echo "::error::Missing secret NPM_PUBLISH_TOKEN. Add a GitHub PAT with write:packages (and repo for Releases)."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@softwareifycz"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Storybook tests
        run: npm run test:storybook

      - name: Build
        run: npm run build

      - name: Verify package version matches Git tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          EXPECTED="${TAG#v}"
          ACTUAL="$(node -p "require('./package.json').version")"
          echo "Git tag: ${TAG}"
          echo "Expected package version: ${EXPECTED}"
          echo "package.json version: ${ACTUAL}"
          if [ "${EXPECTED}" != "${ACTUAL}" ]; then
            echo "::error::Tag '${TAG}' does not match package.json version '${ACTUAL}'. Refusing to publish."
            exit 1
          fi

      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
        run: npm publish

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" --generate-notes --verify-tag
