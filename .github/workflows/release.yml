name: Release

# Tag-driven release. Git tag is the source of truth.
#
# Developer:
#   1. Set package.json "version" to X.Y.Z and merge to main
#   2. git tag vX.Y.Z && git push origin vX.Y.Z
#
# This workflow:
#   validate → storybook tests → version/tag check → npm publish → GitHub Release
#
# Auth: GITHUB_TOKEN only (no personal PAT).
# If publish fails with 403, enable:
#   Settings → Actions → General → Workflow permissions → Read and write

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@softwareifycz"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Storybook tests
        run: npm run test:storybook

      - name: Build
        run: npm run build

      - name: Verify package version matches Git tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          EXPECTED="${TAG#v}"
          ACTUAL="$(node -p "require('./package.json').version")"
          echo "Git tag: ${TAG}"
          echo "Expected package version: ${EXPECTED}"
          echo "package.json version: ${ACTUAL}"
          if [ "${EXPECTED}" != "${ACTUAL}" ]; then
            echo "::error::Tag '${TAG}' does not match package.json version '${ACTUAL}'. Refusing to publish."
            exit 1
          fi

      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" --generate-notes --verify-tag
